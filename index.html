<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Metadata Editor</title><style>body{font:16px system-ui;background:#f3f5fa;color:#202638;margin:0}main{max-width:720px;margin:25px auto;padding:22px;background:white;border-radius:18px;box-shadow:0 8px 30px #15244a12}h1{font-size:25px}label{display:block;margin-top:18px;font-weight:650}input,textarea,button{box-sizing:border-box;font:inherit;width:100%;padding:12px;border:1px solid #ccd3e0;border-radius:10px;margin-top:7px}textarea{min-height:90px}button{background:#254fca;color:white;border:0;font-weight:700;margin-top:22px}button:disabled{opacity:.55}.muted{color:#596478;font-size:14px}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2fa;padding:12px;border-radius:10px;margin-top:15px}small{color:#596478}</style></head><body><main><h1>Stock Metadata Editor</h1><p class="muted">EPS • XMP • ExifTool • для Safari на iPad</p><form id="form"><label>EPS-файли (до 20)<input name="files" id="files" type="file" accept=".eps,application/postscript" multiple required></label><button type="button" id="inspect">Прочитати метадані першого EPS</button><label>Title<input name="title" id="title" placeholder="Mochi dessert collection"></label><label>Description<textarea name="description" id="description" placeholder="Vector illustration of Japanese mochi..."></textarea></label><label>Keywords (через кому, до 50)<textarea name="keywords" id="keywords" placeholder="mochi, dessert, japanese, vector"></textarea></label><small id="count">0 / 50</small><button type="submit" id="submit">Записати XMP та завантажити ZIP</button></form><div id="status" class="result" role="status">Файли обробляються на сервері та не зберігаються постійно. Не завантажуй конфіденційні EPS.</div><p class="muted">Збереження BoundingBox перевіряється. Розпізнавання метаданих Shutterstock не гарантоване.</p></main><script>
const $=id=>document.getElementById(id);const status=$('status');const words=()=> $('keywords').value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);$('keywords').addEventListener('input',()=>{$('count').textContent=words().length+' / 50'});
$('inspect').onclick=async()=>{let f=$('files').files[0];if(!f){status.textContent='Вибери файл';return}let fd=new FormData();fd.append('file',f);status.textContent='Читаю…';try{let r=await fetch('/inspect',{method:'POST',body:fd});status.textContent=JSON.stringify(await r.json(),null,2)}catch(e){status.textContent=String(e)}};
$('form').onsubmit=async e=>{e.preventDefault();if(words().length>50){status.textContent='Більше ніж 50 ключових слів';return}let btn=$('submit');btn.disabled=true;status.textContent='Записую та перевіряю XMP…';try{let r=await fetch('/process',{method:'POST',body:new FormData($('form'))});if(!r.ok){status.textContent=JSON.stringify(await r.json());return}let blob=await r.blob();let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='stock_metadata_eps.zip';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='Готово. ZIP містить EPS та JSON перевірки ExifTool.'}catch(e){status.textContent='Помилка: '+e}finally{btn.disabled=false}};
</script></body></html>
